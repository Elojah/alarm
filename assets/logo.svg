<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="An alarm clock whose face is a sequence of times: those fired lit, one ringing, those to come dim">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c31"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="-150" y1="-150" x2="150" y2="190">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <!-- a bell, flat side towards the clock -->
    <g id="bell-shape">
      <path d="M-46 0 A46 46 0 0 1 46 0 Z" transform="translate(0 -166)" fill="url(#bell)"/>
      <circle cy="-218" r="7" fill="#fde68a"/>
      <path d="M-64 -170 A66 66 0 0 1 -50 -208 M64 -170 A66 66 0 0 0 50 -208" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-opacity="0.55"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="translate(256 268)">
    <use href="#bell-shape" transform="rotate(-42)"/>
    <use href="#bell-shape" transform="rotate(42)"/>

    <g stroke="url(#face)" stroke-width="18" stroke-linecap="round">
      <line y1="150" y2="186" transform="rotate(38)"/>
      <line y1="150" y2="186" transform="rotate(-38)"/>
    </g>
    <circle r="140" fill="#0a1020" stroke="url(#face)" stroke-width="18"/>

    <!-- the sequence: fired, ringing, to come -->
    <g fill="#7dd3fc">
      <circle cy="-104" r="7" transform="rotate(-60)"/>
      <circle cy="-104" r="7" transform="rotate(-30)"/>
      <circle cy="-104" r="7"/>
      <circle cy="-104" r="7" transform="rotate(30)"/>
    </g>
    <g fill="#334155">
      <circle cy="-104" r="6" transform="rotate(90)"/>
      <circle cy="-104" r="6" transform="rotate(120)"/>
      <circle cy="-104" r="6" transform="rotate(150)"/>
      <circle cy="-104" r="6" transform="rotate(180)"/>
      <circle cy="-104" r="6" transform="rotate(210)"/>
      <circle cy="-104" r="6" transform="rotate(240)"/>
      <circle cy="-104" r="6" transform="rotate(270)"/>
    </g>
    <g transform="rotate(60)">
      <circle cy="-104" r="36" fill="url(#glow)"/>
      <line y2="-76" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
      <circle cy="-104" r="11" fill="#fde68a"/>
    </g>
    <circle r="15" fill="#0a1020" stroke="#fbbf24" stroke-width="7"/>
  </g>
</svg>
